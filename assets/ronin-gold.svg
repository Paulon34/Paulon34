<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Paulo DEV — Ronin Gold</title>
<desc id="desc">Banner preto e dourado com um torii, lua, katana, montanhas e detalhes de interface gamer; o texto apresenta Paulo Henrique e a sua identidade de tecnologia.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030405"/><stop offset=".55" stop-color="#0d0c0a"/><stop offset="1" stop-color="#21140f"/></linearGradient>
  <radialGradient id="moon"><stop offset="0" stop-color="#ffe5a1"/><stop offset=".52" stop-color="#d4a547"/><stop offset=".9" stop-color="#8c5a22"/><stop offset="1" stop-color="#70401c"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8c5b27"/><stop offset=".32" stop-color="#ffe09b"/><stop offset=".68" stop-color="#d2a851"/><stop offset="1" stop-color="#805123"/></linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#352018"/><stop offset="1" stop-color="#060607"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8a652d" stroke-width=".65" opacity=".22"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="17"/></filter>
  <clipPath id="frame"><rect width="1276" height="466" x="2" y="2" rx="19"/></clipPath>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .halo{animation:halo 5s ease-in-out infinite}
    .float{animation:float 6s ease-in-out infinite}
    .flicker{animation:flicker 3.6s ease-in-out infinite}
    .sweep{animation:sweep 5.5s linear infinite}
    @keyframes blink{50%{opacity:.08}}
    @keyframes halo{50%{opacity:.50;transform:scale(1.04)}}
    @keyframes float{50%{transform:translateY(-6px)}}
    @keyframes flicker{50%{opacity:.4}}
    @keyframes sweep{0%{transform:translateX(-430px)}100%{transform:translateX(1100px)}}
    @media (prefers-reduced-motion:reduce){.blink,.halo,.float,.flicker,.sweep{animation:none}}
  </style>
</defs>
<rect x="2" y="2" width="1276" height="466" rx="19" fill="url(#background)" stroke="#805f2b" stroke-width="2"/>
<g clip-path="url(#frame)">
  <rect width="1280" height="470" fill="url(#grid)"/>
  <path d="M0 77H1280M0 429H1280" stroke="#ae8646" stroke-width="1" opacity=".32"/>
  <path d="M47 100H706M47 415H706" stroke="#a98747" stroke-width="1" opacity=".22"/>
  <path d="M0 0H1280V15H0Z" fill="#080809" opacity=".65"/>
  <circle cx="1007" cy="233" r="163" fill="#e6a54d" opacity=".23" filter="url(#soft)" class="halo"/>
  <circle cx="1007" cy="233" r="150" fill="url(#moon)" opacity=".86" class="halo"/>
  <circle cx="1007" cy="233" r="168" fill="none" stroke="#d9b268" stroke-width="1" opacity=".48" stroke-dasharray="6 12"/>
  <circle cx="1007" cy="233" r="187" fill="none" stroke="#76542f" stroke-width="1" opacity=".3" stroke-dasharray="2 18"/>
  <path d="M686 401L808 286L885 340L993 226L1135 366L1210 300L1350 439H674Z" fill="url(#mountain)" opacity=".9"/>
  <path d="M792 403L919 312L970 349L1037 305L1163 411H792Z" fill="#09090a" opacity=".94"/>
  <!-- Torii silhouettes: Japanese architectural reference, not a trademark -->
  <g stroke="#100c09" fill="#100c09" opacity=".96">
    <path d="M833 170Q1007 154 1182 170L1170 186Q1007 177 847 186Z"/>
    <path d="M859 191H1157V208H859Z"/>
    <path d="M884 204H910V423H884ZM1103 204H1129V423H1103Z"/>
    <path d="M914 239H1099V253H914Z"/>
  </g>
  <!-- Ronin silhouette and katana -->
  <g class="float">
    <path d="M1004 316L966 341L951 419H1108L1092 333L1058 312L1044 346H1021Z" fill="#070809" stroke="#9e7139" stroke-width="1.4"/>
    <path d="M991 345L1027 379L1042 349M1076 342L1046 379L1070 416" stroke="#bd8f46" stroke-width="3" fill="none" opacity=".8"/>
    <circle cx="1031" cy="284" r="29" fill="#070809" stroke="#bd944e" stroke-width="2"/>
    <path d="M997 279L999 258L1014 246L1031 255L1052 243L1063 262L1067 281Z" fill="#09090a" stroke="#d2a457" stroke-width="2"/>
    <path d="M997 279Q1032 292 1067 279" fill="none" stroke="#cba458" stroke-width="2"/>
    <path d="M1052 360L1152 191" stroke="#f9db91" stroke-width="5" stroke-linecap="round"/>
    <path d="M1042 374L1161 182" stroke="#986527" stroke-width="2" opacity=".6"/>
    <path d="M1041 381L1061 354" stroke="#2a2118" stroke-width="10" stroke-linecap="round"/>
    <path d="M1050 366L1036 358" stroke="#e6b76a" stroke-width="3"/>
  </g>
  <!-- Background motion / HUD -->
  <g fill="#dfbc70">
    <circle cx="801" cy="102" r="3" class="flicker"/><circle cx="1215" cy="113" r="2" class="flicker"/>
    <circle cx="877" cy="319" r="2" class="flicker"/><circle cx="1203" cy="351" r="2" class="flicker"/>
    <circle cx="754" cy="229" r="2" class="flicker"/><circle cx="1090" cy="65" r="2" class="flicker"/>
  </g>
  <g stroke="#d5aa58" fill="none" opacity=".6"><path d="M739 141H764M751 129V154M1202 293H1224M1213 282V304"/><path d="M734 79V99H753M1250 78V99H1231M733 415V396H752M1250 415V396H1231"/></g>
  <rect x="0" y="427" width="470" height="2" fill="url(#gold)" class="sweep" opacity=".55"/>
  <text x="49" y="49" class="mono" fill="#efd6a0" font-size="19" font-weight="700" letter-spacing="3">PAULO HENRIQUE_</text>
  <text x="924" y="48" class="mono" fill="#bea06b" font-size="14">侍  /  RONIN MODE</text>
  <text x="53" y="125" class="mono" fill="#c29b53" font-size="16" letter-spacing="3">LINUX  /  SYSTEMS  /  OPEN SOURCE</text>
  <text x="42" y="264" class="sans" fill="#f5f0e5" font-size="114" font-weight="900" letter-spacing="-6">PAULO</text>
  <text x="42" y="370" class="sans" fill="url(#gold)" font-size="114" font-weight="900" letter-spacing="-6">DEV_</text>
  <rect x="400" y="339" width="12" height="30" fill="#e9be70" class="blink"/>
  <text x="54" y="400" class="mono" fill="#efe2c5" font-size="18">Code. Discipline. Build.</text>
  <g>
    <rect x="51" y="438" width="154" height="23" rx="4" fill="#17130e" stroke="#8d6a36"/>
    <text x="64" y="454" class="mono" font-size="11" fill="#f3d997">RYOKU SYSTEMS</text>
    <rect x="218" y="438" width="122" height="23" rx="4" fill="#17130e" stroke="#8d6a36"/>
    <text x="232" y="454" class="mono" font-size="11" fill="#f3d997">AI / AUTOMATION</text>
    <rect x="353" y="438" width="143" height="23" rx="4" fill="#17130e" stroke="#8d6a36"/>
    <text x="367" y="454" class="mono" font-size="11" fill="#f3d997">ものづくりの道</text>
  </g>
</g>
</svg>